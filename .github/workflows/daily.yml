name: 每日情报生成自动化

on:
  schedule:
    # 每天 UTC 时间 23:00 执行（对应北京时间 07:00）
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许在网页端手动点击运行测试

permissions:
  contents: write # 赋予 Actions 写入仓库的权限，用于保存生成的 HTML

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 获取当前仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 3.11 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # 缓存依赖以提高后续运行速度

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行主程序生成报告
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

    - name: 提交并推送生成的 HTML 文件
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add report/ index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "自动生成报告: $(date +'%Y-%m-%d')" && git push)
